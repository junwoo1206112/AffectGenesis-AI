goal: >-
  기존 v0.1을 보존하고 합성 성공·실패·회복 경험에 따른 상황 구별·대처의
  전이와 유지 및 설계 상태의 행동 영향을 비교하는 로컬 프로토타입과 보고서를 만든다.
constraints:
  - Python 3.12 이상 및 표준 라이브러리만 사용한다.
  - 기존 functional_affect 코드와 기존 테스트의 계약을 보존한다.
  - 실제 사람 데이터, 외부 LLM, 네트워크, MCP 전송, 배포와 Git 쓰기는 제외한다.
  - 수동 편집은 apply_patch만 사용하고 새 실행 폴더만 생성한다.
  - docs/감정_성장_실행_권장안.md의 평가·안전·범위 계약을 따른다.
acceptance_criteria:
  - description: 별도 학습·동결·경험조회 모델이 공통 관측과 안전 계약을 만족한다.
    verify: "$env:PYTHONPATH='src'; python -m unittest discover -s tests -v"
    artifacts: [src/affect_growth, experiments/growth_v0_2.json]
    expect: OK
  - description: 전이·유지·제거·순열·경험순서 비교를 재현하고 증거를 로컬에 보존한다.
    verify: "$env:PYTHONPATH='src'; python -m unittest discover -s tests -p test_growth_evaluation.py -v"
    artifacts: [src/affect_growth/evaluation.py, tests/test_growth_evaluation.py]
    expect: OK
  - description: 실제 실행의 설정·해시·지표와 가설 미지지 여부를 포함한 보고서가 존재한다.
    verify: "$env:PYTHONPATH='src'; python -m affect_growth --verify-report docs/감정_성장_비교_평가_보고서.md"
    artifacts: [docs/감정_성장_비교_평가_보고서.md]
    expect: REPORT VERIFIED
  - description: 전체 회귀와 공백 검사를 통과하며 기존 v0.1 파일이 보존된다.
    verify: git diff --check
    artifacts: [tests/test_growth_safety.py]
    expect: NONE
ontology_schema:
  name: FunctionalAffectGrowthExperiment
  description: 합성 환경의 관측, 기록 경험, 모델 상태, 안전 출력과 paired 평가
  fields:
    - {name: observation, type: object, description: 정답 및 분할 식별자 없는 범주형 관측과 안전 신호}
    - {name: experience, type: object, description: 관측과 기록 행동 및 사후 결과 피드백}
    - {name: checkpoint, type: object, description: 학습 통계·기억·일시 상태와 설정 해시}
    - {name: metrics, type: object, description: 시드별 C·A·J 대비와 유지·상태 영향·안전 판정}
evaluation_principles:
  - {name: safety, description: 모든 비교군의 G0/G1 유지, weight: 1.0}
  - {name: evidence, description: 학습 효과와 정서 상태 영향 및 구현 통과를 분리, weight: 1.0}
  - {name: reproducibility, description: 설정·코드·데이터 해시와 시드 및 원자료 보존, weight: 1.0}
exit_conditions:
  - {name: complete, description: 구현과 실제 비교 보고서의 검증 통과, criteria: 전체 unittest와 diff 및 보고서 검증 통과}
  - {name: stop, description: 오류 또는 안전 위반 발생 시 중단·기록, criteria: 테스트 실패·실행 오류·안전 위반·손상·범위 밖 전송 발견}
